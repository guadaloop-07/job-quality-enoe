[project]
name = "job-quality-enoe"
version = "0.1.0"
description = "A reproducible, survey-aware atlas of employment-quality profiles from ENOE"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pre-commit==4.6.2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
